<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Іконковий шрифт</title>
	<style>
		html,body{
			height: 100%;
		}
		body{
			padding: 1.875rem;
			font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
			font-size: 1em;
			background-color:#333;
			color:#fff;
		}
		.iconfont-page h1{
			font-size: 1.875rem;
			margin-bottom: 2rem;
		}
		.iconfont-page ul{
			display: flex;
			flex-wrap: wrap;
			gap: 2.5rem;
			margin: 0;
			padding: 0;
		}
		.iconfont-page ul li{
			margin-bottom: 0.625rem;
			display: inline-flex;
			gap: 0.625rem;
			list-style: none;
			align-items: center;
		}
		.iconfont-page ul li::before{
			font-size: 2rem;
		}
		@font-face { 
	font-family: "iconfont"; 
	font-display: swap;
	src: url("D://portfolio/headphones/src/assets/svgicons/preview/iconfont.woff2?ef1feba7de06566c26fd7a2d4bef3955") format("woff2"); 
} 
[class*="--icon-"]::before{
	font-family: iconfont; 
}
	[class*="--icon-x"]::before { 
		content: "\f101"; 
	} 
	[class*="--icon-user-sound"]::before { 
		content: "\f102"; 
	} 
	[class*="--icon-speaker"]::before { 
		content: "\f103"; 
	} 
	[class*="--icon-minus"]::before { 
		content: "\f104"; 
	} 
	[class*="--icon-microphone"]::before { 
		content: "\f105"; 
	} 
	[class*="--icon-meta"]::before { 
		content: "\f106"; 
	} 
	[class*="--icon-hand-tap"]::before { 
		content: "\f107"; 
	} 
	[class*="--icon-equalizer"]::before { 
		content: "\f108"; 
	} 
	[class*="--icon-ear"]::before { 
		content: "\f109"; 
	} 
	[class*="--icon-drop"]::before { 
		content: "\f10a"; 
	} 
	[class*="--icon-discord"]::before { 
		content: "\f10b"; 
	} 
	[class*="--icon-cpu"]::before { 
		content: "\f10c"; 
	} 
	[class*="--icon-battery-charging"]::before { 
		content: "\f10d"; 
	} 

	</style>
</head>
<body>
	<div class="iconfont-page">
		<h1>Перелік іконок та їх класів:</h1>
		<ul>
				<li class="--icon-x">--icon-x</li>
				<li class="--icon-user-sound">--icon-user-sound</li>
				<li class="--icon-speaker">--icon-speaker</li>
				<li class="--icon-minus">--icon-minus</li>
				<li class="--icon-microphone">--icon-microphone</li>
				<li class="--icon-meta">--icon-meta</li>
				<li class="--icon-hand-tap">--icon-hand-tap</li>
				<li class="--icon-equalizer">--icon-equalizer</li>
				<li class="--icon-ear">--icon-ear</li>
				<li class="--icon-drop">--icon-drop</li>
				<li class="--icon-discord">--icon-discord</li>
				<li class="--icon-cpu">--icon-cpu</li>
				<li class="--icon-battery-charging">--icon-battery-charging</li>
		</ul>
	</div>
</body>
</html>
